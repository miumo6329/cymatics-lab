[project]
name = "cymatics-lab"
version = "0.1.0"
description = "Music-reactive cymatics-style GLSL visualizer"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "numpy>=1.26",
]

[project.scripts]
cymatics = "cymatics_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cymatics_lab"]
